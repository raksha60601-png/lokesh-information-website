<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">

  <title>Article | Lokesh Information</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    id="metaDescription"
    content="Lokesh Information Tech Article"
  >

  <meta
    name="author"
    content="Lokesh Information"
  >

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  >

  <!-- Canonical will be set automatically for each article -->
  <link
    id="canonicalLink"
    rel="canonical"
    href="https://raksha60601-png.github.io/lokesh-information-website/article.html"
  >

  <!-- Open Graph -->
  <meta
    property="og:type"
    id="ogType"
    content="article"
  >

  <meta
    property="og:title"
    id="ogTitle"
    content="Article | Lokesh Information"
  >

  <meta
    property="og:description"
    id="ogDescription"
    content="Lokesh Information Tech Article"
  >

  <meta
    property="og:url"
    id="ogUrl"
    content="https://raksha60601-png.github.io/lokesh-information-website/article.html"
  >

  <meta
    property="og:site_name"
    content="Lokesh Information"
  >

  <meta
    property="og:locale"
    content="hi_IN"
  >

  <meta
    property="og:image"
    id="ogImage"
    content=""
  >

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    id="twitterTitle"
    content="Article | Lokesh Information"
  >

  <meta
    name="twitter:description"
    id="twitterDescription"
    content="Lokesh Information Tech Article"
  >

  <meta
    name="twitter:image"
    id="twitterImage"
    content=""
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .article-page{
      width:min(850px,92%);
      margin:auto;
      padding:55px 0 80px;
    }

    .article-back{
      display:inline-block;
      margin-bottom:25px;
      color:#36e6ff;
      font-size:12px;
      font-weight:bold;
    }

    .article-category{
      color:#36e6ff;
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .article-page h1{
      font-size:clamp(32px,5vw,55px);
      line-height:1.15;
      margin:12px 0;
    }

    .article-date{
      color:#71828e;
      font-size:11px;
      margin-bottom:25px;
    }

    .article-cover{
      width:100%;
      max-height:500px;
      object-fit:cover;
      border-radius:18px;
      margin:25px 0 35px;
      border:1px solid rgba(80,220,255,.14);
    }

    .article-content{
      color:#cbd9df;
      font-size:16px;
      line-height:1.9;
    }

    .article-content h2{
      color:#eefaff;
      margin-top:35px;
      font-size:26px;
    }

    .article-content p{
      margin:18px 0;
    }

    .article-content ul{
      padding-left:25px;
    }

    .article-content li{
      margin:10px 0;
    }

    .article-share{
      margin-top:40px;
      padding:20px;
      border:1px solid rgba(80,220,255,.14);
      border-radius:15px;
      background:rgba(255,255,255,.025);
    }

    .article-share a{
      color:#36e6ff;
      font-weight:bold;
    }

    @media(max-width:600px){

      .article-page{
        padding-top:35px;
      }

      .article-content{
        font-size:15px;
      }

      .article-page h1{
        font-size:32px;
      }

    }

  </style>
</head>

<body>

  <main class="article-page">

    <a
      class="article-back"
      href="articles.html"
    >
      ← सभी Articles
    </a>

    <div
      id="article"
    >
      Article loading…
    </div>

  </main>


  <script>

    const articleBox =
      document.getElementById("article");

    const params =
      new URLSearchParams(window.location.search);

    const articleId =
      params.get("id");


    fetch("articles.json?ts=" + Date.now())

      .then(response => {

        if(!response.ok){
          throw new Error("articles.json not found");
        }

        return response.json();

      })

      .then(data => {

        const articles =
          Array.isArray(data)
            ? data
            : data.articles || [];

        const article =
          articles.find(item => item.id === articleId);


        if(!article){

          articleBox.innerHTML = `
            <h1>Article नहीं मिला</h1>
            <p>
              यह article उपलब्ध नहीं है या इसका link गलत है।
            </p>
          `;

          return;

        }


        /* =========================
           BASIC SEO
        ========================== */

        const title =
          article.title ||
          "Tech Article | Lokesh Information";

        const description =
          article.excerpt ||
          article.title ||
          "Lokesh Information Tech Article";

        const articleUrl =
          window.location.origin +
          window.location.pathname +
          "?id=" +
          encodeURIComponent(article.id);


        document.title =
          title + " | Lokesh Information";


        document
          .getElementById("metaDescription")
          .setAttribute(
            "content",
            description
          );


        /* =========================
           CANONICAL
        ========================== */

        document
          .getElementById("canonicalLink")
          .setAttribute(
            "href",
            articleUrl
          );


        /* =========================
           OPEN GRAPH
        ========================== */

        document
          .getElementById("ogTitle")
          .setAttribute(
            "content",
            title
          );

        document
          .getElementById("ogDescription")
          .setAttribute(
            "content",
            description
          );

        document
          .getElementById("ogUrl")
          .setAttribute(
            "content",
            articleUrl
          );


        /* =========================
           TWITTER
        ========================== */

        document
          .getElementById("twitterTitle")
          .setAttribute(
            "content",
            title
          );

        document
          .getElementById("twitterDescription")
          .setAttribute(
            "content",
            description
          );


        /* =========================
           IMAGE SEO
        ========================== */

        if(article.image){

          document
            .getElementById("ogImage")
            .setAttribute(
              "content",
              new URL(
                article.image,
                window.location.href
              ).href
            );

          document
            .getElementById("twitterImage")
            .setAttribute(
              "content",
              new URL(
                article.image,
                window.location.href
              ).href
            );

        }


        /* =========================
           ARTICLE STRUCTURED DATA
        ========================== */

        const publishedDate =
          article.date
            ? article.date + "T00:00:00+05:30"
            : undefined;

        const articleSchema = {

          "@context":
            "https://schema.org",

          "@type":
            "Article",

          "@id":
            articleUrl + "#article",

          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": articleUrl
          },

          "headline":
            title,

          "description":
            description,

          "datePublished":
            publishedDate,

          "dateModified":
            publishedDate,

          "author": {
            "@type": "Person",
            "name": "Lokesh Information",
            "url":
              window.location.origin +
              window.location.pathname.replace(
                "article.html",
                ""
              )
          },

          "publisher": {
            "@type": "Organization",
            "name": "Lokesh Information",
            "url":
              window.location.origin +
              window.location.pathname.replace(
                "article.html",
                ""
              )
          }

        };


        if(article.image){

          articleSchema.image = [
            new URL(
              article.image,
              window.location.href
            ).href
          ];

        }


        const oldSchema =
          document.getElementById(
            "articleStructuredData"
          );

        if(oldSchema){
          oldSchema.remove();
        }


        const schemaScript =
          document.createElement("script");

        schemaScript.type =
          "application/ld+json";

        schemaScript.id =
          "articleStructuredData";

        schemaScript.textContent =
          JSON.stringify(
            articleSchema
          );

        document.head.appendChild(
          schemaScript
        );


        /* =========================
           ARTICLE CONTENT
        ========================== */

        articleBox.innerHTML = `

          <div class="article-category">
            ${article.category || "TECH"}
          </div>

          <h1>
            ${article.title}
          </h1>

          <div class="article-date">
            ${article.date || ""}
          </div>

          ${
            article.image
            ? `
              <img
                class="article-cover"
                src="${article.image}"
                alt="${article.title}"
                loading="eager"
              >
            `
            : ""
          }

          <div class="article-content">

            ${
              article.content ||
              `<p>${article.excerpt || ""}</p>`
            }

          </div>

          <div class="article-share">

            📱 यह Article पसंद आया?

            <br><br>

            अपने दोस्तों के साथ Share करें और
            <a href="index.html">
              Lokesh Information
            </a>
            पर ऐसे ही Tech Articles पढ़ें।

          </div>

        `;

      })

      .catch(error => {

        console.error(error);

        articleBox.innerHTML = `
          <h1>Article Load नहीं हो पाया</h1>
          <p>
            कृपया थोड़ी देर बाद दोबारा कोशिश करें।
          </p>
        `;

      });

  </script>

</body>
</html>
